[package]
name = "claude-hydra"
version = "1.1.0"
description = "Claude-Hydra - run several Claude desktop accounts side by side"
license = "MIT"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "claude_hydra_lib"
crate-type = ["staticlib", "rlib"]
doctest = false

[build-dependencies]
cc = "1"
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
tauri-plugin-updater = "2"
# Folder picker for the folders shared into containers.
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
time = { version = "0.3", features = ["parsing"] }
tauri = { version = "2.8.2", features = ["tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks", "system-proxy"] }
base64 = "0.22"
aes-gcm = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Dock icon (app_icon.rs); the versions Tauri already uses.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"

[target.'cfg(windows)'.dependencies]
# Same versions Tauri's WebView2 backend uses; for the account browser's DevTools calls.
webview2-com = "0.39"
windows = "0.62"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"
